name: Publish STC Toolkit releases
# Marketplace publisher: SiboXu

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1

      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          ref: v3
          path: v3

      - name: Checkout v3.1
        uses: actions/checkout@v4
        with:
          ref: v3.1
          path: v3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Package v1
        working-directory: v1
        run: vsce package --out ../stc-toolkit-0.1.0.vsix

      - name: Package v2
        working-directory: v2
        run: vsce package --out ../stc-toolkit-0.2.0.vsix

      - name: Package v3
        working-directory: v3
        run: vsce package --out ../stc-toolkit-0.3.0.vsix

      - name: Package v3.1
        working-directory: v3.1
        run: vsce package --out ../stc-toolkit-0.3.1.vsix

      - name: Publish v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 stc-toolkit-0.1.0.vsix --clobber --repo "${{ github.repository }}"
          else
            gh release create v1.0.0 stc-toolkit-0.1.0.vsix --repo "${{ github.repository }}" --target v1 --title "v1" --notes "STC Toolkit v1 (0.1.0): initial public release with Keil project detection, Build/Rebuild, stcgal support for common legacy STC families, a custom flash backend, and an official STC-ISP launcher fallback."
          fi

      - name: Publish v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v2.0.0 stc-toolkit-0.2.0.vsix --clobber --repo "${{ github.repository }}"
          else
            gh release create v2.0.0 stc-toolkit-0.2.0.vsix --repo "${{ github.repository }}" --target v2 --title "v2" --notes "STC Toolkit v2 (0.2.0): multi-backend architecture, backward-compatible stcgal support, experimental native USB-HID backend, official-tool fallback for STC32G144K246 and other new or large-flash devices, automatic backend selection, and English-first bilingual documentation."
          fi

      - name: Publish v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v3.0.0 stc-toolkit-0.3.0.vsix --clobber --repo "${{ github.repository }}"
          else
            gh release create v3.0.0 stc-toolkit-0.3.0.vsix --repo "${{ github.repository }}" --target v3 --title "v3" --notes "STC Toolkit v3 (0.3.0): K5-style editor toolbar with one-click Build, Flash and Build & Flash buttons, quieter workflow options, and improved configuration-first UX. STC32G144K246 still uses the official backend for the final programming step until extended native USB-HID support is complete."
          fi

      - name: Publish v3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v3.1.0 stc-toolkit-0.3.1.vsix --clobber --repo "${{ github.repository }}"
          else
            gh release create v3.1.0 stc-toolkit-0.3.1.vsix --repo "${{ github.repository }}" --target v3.1 --title "v3.1" --notes "STC Toolkit v3.1 (0.3.1): one-click K5-style editor workflow plus automatic Keil HEX/IHX detection. The extension reads Keil OutputDirectory/OutputName, prefers firmware produced by the current build, falls back to common output folders, and shows the detected firmware in the VS Code status bar."
          fi
