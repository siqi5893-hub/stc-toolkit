name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/marketplace-publish.yml"
  workflow_run:
    workflows:
      - "Publish STC Toolkit releases"
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show extension version
        run: node -e "console.log('Publishing STC Toolkit v' + require('./package.json').version)"

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out stc-toolkit-marketplace.vsix

      - name: Publish to Visual Studio Marketplace with OIDC
        continue-on-error: true
        run: npx --yes @vscode/vsce@latest publish --packagePath stc-toolkit-marketplace.vsix --oidc --skip-duplicate

      - name: Setup hint
        if: always()
        run: |
          echo "Marketplace publishing uses GitHub OIDC trusted publishing."
          echo "No VSCE_PAT is stored in this repository."
          echo "If the publish step failed, configure this repository/workflow as a trusted publisher in the Visual Studio Marketplace publisher settings."
