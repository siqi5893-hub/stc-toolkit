name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/marketplace-publish.yml"
  workflow_run:
    workflows:
      - "Publish STC Toolkit releases"
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show extension version
        run: node -e "console.log('Publishing STC Toolkit v' + require('./package.json').version)"

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out stc-toolkit-marketplace.vsix

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@latest publish --packagePath stc-toolkit-marketplace.vsix --skip-duplicate

      - name: Missing Marketplace credential
        if: env.VSCE_PAT == ''
        run: |
          echo "::warning::VSCE_PAT is not configured. GitHub Release packaging succeeded, but Marketplace publishing was skipped."
          echo "Add VSCE_PAT under Repository Settings -> Secrets and variables -> Actions."
          echo "The token needs Visual Studio Marketplace (Manage) permission."
